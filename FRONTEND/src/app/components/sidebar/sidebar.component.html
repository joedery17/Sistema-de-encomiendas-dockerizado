<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
      </svg>
      <h2>Encomiendas</h2>
    </div>
    <p class="subtitulo">Sistema de Gestión</p>
  </div>

  <nav class="sidebar-nav">
    @for (item of menuItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <p class="user-label">Usuario</p>
      <p class="user-name">{{ usuarioActual?.nombre_usuario || 'Admin' }}</p>
      <p class="user-role">{{ usuarioActual?.rol || 'admin' }}</p>
    </div>
    <button (click)="cerrarSesion()" class="btn-cerrar">
      <svg class="cerrar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>
