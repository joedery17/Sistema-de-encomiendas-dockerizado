<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
      </div>
      <h1>Sistema de Encomiendas</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input 
          type="text" 
          id="usuario" 
          [(ngModel)]="usuario" 
          name="usuario" 
          class="input-field" 
          placeholder="Ingresa tu usuario" 
          required 
          [disabled]="cargando()" 
        />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input 
          type="password" 
          id="contrasena" 
          [(ngModel)]="contrasena" 
          name="contrasena" 
          class="input-field" 
          placeholder="••••••••" 
          required 
          [disabled]="cargando()" 
        />
      </div>

      @if (mensajeError()) {
        <div class="error-message">{{ mensajeError() }}</div>
      }

      <button type="submit" class="btn-primary btn-block" [disabled]="cargando()">
        @if (cargando()) {
          <span class="spinner-small"></span>
          <span>Ingresando...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <p>Credenciales de prueba:</p>
      <div class="test-credentials">
        <code>Usuario: admin | Contraseña: 123</code>
        <code>Usuario: operador1 | Contraseña: 123</code>
      </div>
    </div>
  </div>
</div>
